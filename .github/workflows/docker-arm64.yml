name: Build and Push ARM64 image (all-in-one)

# Собирает Dockerfile.all-in-one под linux/arm64 и публикует в GitHub Container
# Registry (ghcr.io/<owner>/metamcp-all-in-one).
#
# Раннер — ubuntu-24.04-arm, то есть сборка идёт нативно на aarch64.
# Через QEMU этот образ собирать нельзя: `pnpm build` (Next.js) под эмуляцией
# уходит за лимит времени job'а.
#
# Сборка идёт в Bridgetto, а не здесь: пайплайн metamcp-ci организации
# Bridgetto (job metamcp-image на bridgetto-vm, linux/arm64 нативно) собирает
# каждый пуш в ai-dev и публикует те же теги latest и sha-<short> в
# ghcr.io/david-dvinskykh/metamcp-all-in-one; watchtower на Raspberry Pi
# подхватывает latest как раньше.
#
# Этот воркфлоу остался только как ручной запасной вариант (workflow_dispatch)
# на случай, когда Bridgetto собрать не может. Сам по себе он не запускается и
# GitHub Actions минут не тратит.

on:
  workflow_dispatch:
    inputs:
      metamcp_base:
        description: "Откуда брать MetaMCP: собрать из исходников или взять готовый образ"
        type: choice
        options:
          - source
          - prebuilt
        default: source
      extra_tag:
        description: "Дополнительный тег образа (необязательно, например 1.2.3)"
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-all-in-one

concurrency:
  group: docker-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # Образ большой (node_modules билдера + рантайма), а на раннере
      # свободного места немного. Чистим заранее, чтобы сборка не упала
      # на "no space left on device".
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      # inputs.ref: при вызове из bump-pins.yml собирать надо коммит бота, а не
      # github.sha, который зафиксирован на начале запуска — то есть на
      # состоянии ДО обновления пинов.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
          labels: |
            org.opencontainers.image.title=MetaMCP custom (all-in-one, arm64)
            org.opencontainers.image.description=MetaMCP с предустановленными telegram, instagram, zenmoney, gocardless, portainer и lightpanda MCP

      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # METAMCP_REPO/COMMIT: собираем ровно тот коммит, который приехал в
          # этот пуш, а не значение ARG по умолчанию. Иначе после каждого
          # мерджа в ai-dev пин в Dockerfile пришлось бы двигать руками, а до
          # тех пор latest молча собирался бы из старого кода.
          # Внутри блока build-args комментарии писать нельзя: там каждая
          # строка уходит в docker build как KEY=VALUE.
          build-args: |
            METAMCP_BASE=${{ inputs.metamcp_base || 'source' }}
            METAMCP_REPO=${{ github.server_url }}/${{ github.repository }}.git
            METAMCP_COMMIT=${{ inputs.ref || github.sha }}
          cache-from: type=gha,scope=all-in-one-arm64
          # ignore-error: кэш GitHub Actions ограничен 10 ГБ, слепок сборки
          # в него может не влезть — это не повод валить сборку.
          cache-to: type=gha,mode=max,scope=all-in-one-arm64,ignore-error=true

      # Проверяем именно опубликованный образ: что он действительно aarch64,
      # что все обёртки на месте и что нативные части (Go-бинарник portainer-mcp,
      # venv telegram-mcp) запускаются.
      - name: Smoke test published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          METAMCP_BASE: ${{ inputs.metamcp_base || 'source' }}
        run: |
          set -euxo pipefail
          # Версии больше не зашиты в проверку: bump-pins.yml двигает ARG'и сам,
          # и захардкоженное число делало бы каждое автообновление красной сборкой.
          LIGHTPANDA_EXPECTED=$(sed -n 's/^ARG LIGHTPANDA_VERSION=//p' Dockerfile.all-in-one)
          test -n "$LIGHTPANDA_EXPECTED"
          # Освобождаем место под docker pull: слепок сборки уже уехал в gha-кэш.
          docker buildx prune -af || true
          df -h /
          docker pull "$IMAGE"

          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "arm64"

          # -e VAR="$VAR", а не -e VAR: голая форма берёт значение из окружения
          # процесса docker, а обычная переменная шага туда не попадает —
          # внутри контейнера под set -u она разворачивается в ошибку.
          docker run --rm -e LIGHTPANDA_EXPECTED="$LIGHTPANDA_EXPECTED" --entrypoint /bin/sh "$IMAGE" -euxc '
            test "$(uname -m)" = "aarch64"
            command -v telegram-mcp
            command -v mcp-instagram-dm
            command -v zenmoney-mcp
            command -v zenmoney-mcp-ddvin
            command -v one-zenwallet-mcp
            command -v gocardless-mcp
            command -v better-telegram-mcp
            command -v better-telegram-mcp-go
            command -v mcp-server-fetch
            command -v curl-mcp
            command -v receipts-mcp
            command -v notion-proxy-search-mcp
            command -v portainer-mcp
            command -v lightpanda
            command -v lightpanda-mcp
            # версия должна совпадать с LIGHTPANDA_VERSION: nightly-тег
            # переписывается, и подмена релиза иначе прошла бы незаметно
            test "$(lightpanda version)" = "$LIGHTPANDA_EXPECTED"
            # ровно та регрессия, из-за которой сервер и переехал в образ:
            # mcp 2.0 убрал mcp.server.fastmcp, а пакет верхнюю границу не ставит
            # ничто в кэше uv не должно принадлежать root: иначе uv run от
            # nextjs падает с "failed to symlink ... Permission denied"
            test -z "$(find /home/nextjs/.cache/uv ! -user nextjs -print -quit)"
            # запрет на скачивание Python — только на время сборки; в рантайме
            # uvx-серверу может понадобиться своя версия интерпретатора
            test "${UV_PYTHON_DOWNLOADS:-unset}" != "never"
            test -w "$HOME"
            py=/opt/uv-tools/better-telegram-mcp/bin/python
            test -x "$py"
            "$py" -c "import better_telegram_mcp, mcp.server.fastmcp"
            "$py" -c "import importlib.metadata as m; v=m.version(\"mcp\"); assert int(v.split(\".\")[0]) < 2, v; print(\"mcp\", v)"
            /usr/local/lib/portainer-mcp/portainer-mcp -h 2>&1 | grep -q -- "-disable-version-check"
            /opt/telegram-mcp/.venv/bin/python -c "import telethon, mcp; print(telethon.__version__)"
            # обёртки Python-серверов не должны звать uv: `uv run` остаётся
            # процессом-родителем на всё время жизни сервера и стоит десятки МБ
            ! grep -q "uv " /usr/local/bin/telegram-mcp
            head -1 /usr/local/bin/better-telegram-mcp | grep -q "^#!/opt/uv-tools/"
            # Go-сборка — статический бинарник, а не шим: ни интерпретатора,
            # ни venv за спиной, поэтому и обёртки ей не нужно
            head -c 4 /usr/local/bin/better-telegram-mcp-go | grep -q ELF
            better-telegram-mcp-go version
            head -1 /usr/local/bin/mcp-server-fetch | grep -q "^#!/opt/uv-tools/"
            # curl-mcp зовёт бинарник curl, а не реализует HTTP сам: без него
            # сервер поднимется и упадёт на первом же запросе
            command -v curl
            curl-mcp --version
            test -w /var/lib/curl-mcp/downloads
            # receipts-mcp — Go-бинарник, stdio по умолчанию; хранилище учёток
            # должно быть записываемым, иначе шифрованный файл ключей не создать
            receipts-mcp -version
            test -w /var/lib/receipts-mcp
            # notion-proxy-search-mcp — Go-бинарник плюс весовой блоб рядом.
            # Блоб проверяем по магии и размеру: COPY из билдера может доехать
            # обрезанным, и тогда сервер поднимется, а поиск молча останется
            # только на BM25. Зеркало и сокет демона живут в каталоге данных,
            # он обязан быть записываемым.
            notion-proxy-search-mcp version
            head -c 8 /usr/local/lib/notion-proxy-search-mcp/model.npse | grep -q NPSE
            test "$(stat -c%s /usr/local/lib/notion-proxy-search-mcp/model.npse)" -gt 100000000
            test -w /var/lib/notion-proxy-search-mcp
            node /usr/local/lib/zenmoney-mcp-ddvin/build/index.js --help >/dev/null 2>&1 || true
            test -f /usr/local/lib/zenmoney-mcp-ddvin/build/index.js
            test -f /usr/local/lib/gocardless-mcp/build/index.js
            test -w /var/lib/gocardless-mcp
            test -f /app/docker-entrypoint.sh
            test -d /app/apps/frontend/.next
            test -d /app/apps/backend/dist
            test -d /app/apps/frontend/node_modules
            # docker-entrypoint.sh гоняет миграции ровно так же
            cd /app/apps/backend && pnpm exec drizzle-kit --version
          '

          # one-zenwallet-mcp — ESM-бандл с внешними @modelcontextprotocol/sdk
          # и zod. Проверка `command -v` тут ничего не значит: сервер падает уже
          # на импортах, если рядом нет package.json с "type": "module" или не
          # доедут зависимости. Поэтому гоняем настоящий MCP-handshake.
          docker run --rm -i --entrypoint one-zenwallet-mcp "$IMAGE" > /tmp/ozw.out <<'JSONRPC' || true
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          JSONRPC
          head -c 300 /tmp/ozw.out
          grep -q '"serverInfo"' /tmp/ozw.out
          grep -q '"result"' /tmp/ozw.out

          # gocardless-mcp: сервер требует секреты GoCardless и без них
          # завершается ещё до handshake. Настоящих секретов в CI нет, поэтому
          # проверяем ровно то, что можно без сети, — что сервер поднимается на
          # фиктивной паре, отдаёт serverInfo и объявляет свои инструменты.
          docker run --rm -i \
            -e GOCARDLESS_SECRET_ID=ci-smoke -e GOCARDLESS_SECRET_KEY=ci-smoke \
            --entrypoint gocardless-mcp "$IMAGE" > /tmp/gc.out <<'JSONRPC' || true
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          JSONRPC
          head -c 300 /tmp/gc.out
          grep -q '"gocardless-bank-account-data"' /tmp/gc.out
          grep -q '"connect_bank"' /tmp/gc.out
          grep -q '"get_account_transactions"' /tmp/gc.out

          # receipts-mcp: stdio-сервер выгрузки чеков (go-sdk). Пайп-handshake
          # тут не годится: на мгновенном EOF от heredoc сервер закрывает сессию
          # раньше, чем успевает ответить, и stdout пуст (в MetaMCP пайп живёт,
          # проблемы нет). Поэтому проверяем строку старта в stderr — она
          # доказывает, что бинарник запускается на aarch64 и MCP-сервер встал.
          docker run --rm -i --entrypoint receipts-mcp "$IMAGE" </dev/null > /tmp/rc.out 2> /tmp/rc.err || true
          cat /tmp/rc.err
          grep -q 'serving MCP over stdio' /tmp/rc.err

          # lightpanda-mcp — тот же случай: `command -v` не проверяет ни
          # динамические зависимости бинарника (нужен GLIBC_2.34), ни то, что
          # серверу хватает прав в /var/lib/lightpanda. Гоняем handshake и
          # заодно проверяем, что stderr чист: обёртка гасит телеметрию, а её
          # предупреждения MetaMCP показывает как ошибки сервера.
          docker run --rm -i --entrypoint lightpanda-mcp "$IMAGE" > /tmp/lp.out 2> /tmp/lp.err <<'JSONRPC' || true
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          JSONRPC
          head -c 300 /tmp/lp.out
          cat /tmp/lp.err
          grep -q '"name":"lightpanda"' /tmp/lp.out
          grep -q '"name":"markdown"' /tmp/lp.out
          ! grep -q 'scope=telemetry' /tmp/lp.err

          # notion-proxy-search-mcp: stdio-сервер поверх локального зеркала.
          # Токена Notion в CI нет, и он не нужен: без него serve поднимает
          # пустое зеркало и отдаёт инструменты — ровно это и проверяем, плюс
          # NPS_NO_DAEMON=1, чтобы процесс не пытался отпочковать демона
          # синхронизации. Инструменты перечисляем по именам: они и есть
          # контракт с MetaMCP, и выпадение любого из них — регрессия.
          docker run --rm -i \
            -e NPS_NO_DAEMON=1 \
            --entrypoint notion-proxy-search-mcp "$IMAGE" > /tmp/nps.out 2> /tmp/nps.err <<'JSONRPC' || true
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          JSONRPC
          head -c 300 /tmp/nps.out
          cat /tmp/nps.err
          grep -q '"name":"notion-proxy-search"' /tmp/nps.out
          for tool in notion-search notion-fetch notion-query-data-sources \
                      notion-list-data-sources notion-recall notion-mirror-status notion-resync; do
            grep -q "\"$tool\"" /tmp/nps.out
          done

          # Патч таймаута прокси Next.js живёт в node_modules, который pnpm
          # в рантайм-стадии может пересобрать. Проверяем, что 600000 доехало
          # до образа, иначе регрессия проходит незаметно.
          if [ "$METAMCP_BASE" = "source" ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -euxc '
              for f in /app/node_modules/.pnpm/next@*/node_modules/next/dist/server/lib/router-utils/proxy-request.js \
                       /app/node_modules/.pnpm/next@*/node_modules/next/dist/esm/server/lib/router-utils/proxy-request.js; do
                grep -q 600000 "$f"
              done
            '
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Опубликованный образ (linux/arm64)"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
